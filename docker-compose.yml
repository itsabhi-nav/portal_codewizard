# Local Supabase stack for CodeWizard development.
# Usage:
#   docker compose up -d
#   # Wait for health, then apply migrations + seed:
#   supabase db reset   # or: psql -f supabase/migrations/0001_init.sql ...
#
# The app can then use these local values in .env.local:
#   NEXT_PUBLIC_SUPABASE_URL=http://localhost:54321
#   NEXT_PUBLIC_SUPABASE_ANON_KEY=<anon key from supabase>
#   SUPABASE_SERVICE_ROLE_KEY=<service role key from supabase>
#
# For the exact keys, run `supabase start` (Supabase CLI) or copy them from
# Supabase Studio (http://localhost:54323) -> Settings -> API.

services:
  postgres:
    image: supabase/postgres:15.8.1.133
    container_name: codewizard-postgres
    restart: unless-stopped
    ports:
      - "54322:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-super-secret-postgres-password}
      POSTGRES_DB: postgres
    volumes:
      - codewizard_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  studio:
    image: supabase/studio:latest
    container_name: codewizard-studio
    restart: unless-stopped
    ports:
      - "54323:3000"
    environment:
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-super-secret-postgres-password}
      SUPABASE_URL: http://kong:8000
      SUPABASE_PUBLIC_URL: http://localhost:54321
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-super-secret-anon-key}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-super-secret-service-key}
    depends_on:
      - postgres

  kong:
    image: kong:2.8.1
    container_name: codewizard-kong
    restart: unless-stopped
    ports:
      - "54321:8000"
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /var/lib/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: request-transformer,cors,ip-restriction
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    volumes:
      - ./supabase/kong.yml:/var/lib/kong/kong.yml:ro
    depends_on:
      - postgres

  rest:
    image: postgrest/postgrest:v12.2.3
    container_name: codewizard-rest
    restart: unless-stopped
    environment:
      PGRST_DB_URI: postgres://postgres:${POSTGRES_PASSWORD:-super-secret-postgres-password}@postgres:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}
      PGRST_DB_USE_LEGACY_GUCS: "false"
    depends_on:
      - postgres

  meta:
    image: supabase/postgres-meta:latest
    container_name: codewizard-meta
    restart: unless-stopped
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: postgres
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: postgres
      PG_META_DB_USER: postgres
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD:-super-secret-postgres-password}
    depends_on:
      - postgres

volumes:
  codewizard_pgdata:
